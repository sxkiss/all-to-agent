<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f0f0;height:100vh;display:flex}
.sidebar{width:260px;background:#202123;color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:16px;border-bottom:1px solid #3a3a3a}
.sidebar-header h2{font-size:16px;margin-bottom:10px}
.sidebar-header button{width:100%;padding:10px;background:#3a3a3a;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px}
.sidebar-header button:hover{background:#4a4a4a}
.conv-list{flex:1;overflow-y:auto;padding:8px}
.conv-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:#ccc;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
.conv-item:hover{background:#2a2a2a}
.conv-item.active{background:#3a3a3a;color:#fff}
.conv-item .info{flex:1;overflow:hidden}
.conv-item .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item .time{font-size:11px;color:#888;display:block;margin-top:2px}
.conv-item .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px;font-weight:600;vertical-align:middle}
.badge.claude{background:#1a73e8;color:#fff}
.badge.codex{background:#34a853;color:#fff}
.badge.opencode{background:#e8710a;color:#fff}
.conv-item .del-btn{background:none;border:none;color:#888;cursor:pointer;font-size:16px;padding:0 4px;opacity:0;transition:opacity .2s}
.conv-item:hover .del-btn{opacity:1}
.conv-item .del-btn:hover{color:#f44}
.main{flex:1;display:flex;flex-direction:column}
.header{padding:12px 20px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:16px;color:#333}
.header .info{font-size:12px;color:#888}
.backend-bar{display:flex;gap:6px;align-items:center}
.backend-btn{padding:4px 12px;border-radius:16px;border:1px solid #ddd;background:#fff;font-size:12px;cursor:pointer;color:#555;transition:all .15s}
.backend-btn.active{background:#0084ff;color:#fff;border-color:#0084ff}
.backend-btn:hover:not(.active){background:#f0f0f0}
.reset-btn{padding:4px 10px;border-radius:16px;border:1px solid #f44;background:#fff;font-size:12px;cursor:pointer;color:#f44;transition:all .15s;margin-left:8px}
.reset-btn:hover{background:#f44;color:#fff}
.chat-container{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:75%;padding:12px 16px;border-radius:12px;line-height:1.6;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#0084ff;color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#fff;color:#333;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.streaming-cursor::after{content:'▌';animation:blink 1s step-end infinite;color:#0084ff}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.msg.assistant pre{background:#1e1e1e;color:#d4d4d4;padding:12px;border-radius:6px;overflow-x:auto;font-size:13px;margin:8px 0}
.msg.assistant code{background:#e8e8e8;padding:2px 5px;border-radius:3px;font-size:13px}
.msg.assistant pre code{background:none;padding:0}
.tool-call{background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;margin:6px 0;font-size:13px;overflow:hidden}
.tool-call-header{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;user-select:none;font-family:"SF Mono","Fira Code",monospace;font-weight:600;font-size:12px}
.tool-call-header:hover{background:#eef1f5}
.tool-call-header .icon{font-size:14px}
.tool-call-header .name{color:#0550ae}
.tool-call-header .arrow{margin-left:auto;color:#8b949e;font-size:12px;transition:transform .15s}
.tool-call-header .arrow.open{transform:rotate(90deg)}
.tool-call-body{padding:8px 10px;border-top:1px solid #d0d7de;font-family:"SF Mono","Fira Code",monospace;font-size:12px;white-space:pre-wrap;max-height:300px;overflow-y:auto;display:none;background:#fafbfc}
.tool-call-body.open{display:block}
.tool-call-result{background:#f0f8f0;border-top:1px solid #c0d8c0}
.welcome{text-align:center;color:#999;margin-top:40vh;font-size:15px}
.typing{display:none;align-self:flex-start;padding:12px 16px;background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.typing.active{display:flex;gap:4px}
.typing span{width:8px;height:8px;background:#999;border-radius:50%;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
.input-bar{background:#fff;border-top:1px solid #e0e0e0;padding:12px 16px;display:flex;gap:10px;align-items:flex-end}
.input-bar textarea{flex:1;border:1px solid #ddd;border-radius:8px;padding:10px 12px;font-size:14px;resize:none;font-family:inherit;outline:none;max-height:120px;min-height:42px;line-height:1.5}
.input-bar textarea:focus{border-color:#0084ff}
.input-bar button{background:#0084ff;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;cursor:pointer}
.input-bar button:hover{background:#0070dd}
.input-bar button:disabled{background:#ccc}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>对话列表</h2>
    <button onclick="newChat()">+ 新对话</button>
  </div>
  <div class="conv-list" id="convList"></div>
</div>

<div class="main">
  <div class="header">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;gap:12px">
        <h1 id="chatTitle">小助手</h1>
        <button class="reset-btn" onclick="resetSession()" title="新开一个 CLI 会话，清除上下文">🔄 重置会话</button>
      </div>
      <div class="backend-bar" id="backendBar">
        <button class="backend-btn active" data-be="claude">Claude</button>
        <button class="backend-btn" data-be="codex">Codex</button>
        <button class="backend-btn" data-be="opencode">OpenCode</button>
      </div>
    </div>
    <div class="info" id="info">加载中...</div>
  </div>
  <div class="chat-container" id="chat">
    <div class="welcome">开始一个新的对话</div>
  </div>
  <div class="typing" id="typing"><span></span><span></span><span></span></div>
  <div class="input-bar">
    <textarea id="input" placeholder="输入消息..." rows="1"></textarea>
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
</div>

<script>
const API = location.origin;
let convId = null;
let currentBackend = 'claude';
let backendConvIds = {};  // 每个后端独立的 conversation id

const chatEl = document.getElementById('chat');
const input = document.getElementById('input');
const typing = document.getElementById('typing');
const sendBtn = document.getElementById('sendBtn');
const info = document.getElementById('info');
const convList = document.getElementById('convList');
const chatTitle = document.getElementById('chatTitle');

document.querySelectorAll('.backend-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.backend-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentBackend = btn.dataset.be;
    // 切换到该后端的对话
    convId = backendConvIds[currentBackend] || null;
    if (convId) {
      loadConv(convId);
    } else {
      chatEl.innerHTML = '<div class="welcome">开始一个新的对话</div>';
      chatTitle.textContent = '小助手';
    }
  });
});

function setBackend(be) {
  currentBackend = be;
  document.querySelectorAll('.backend-btn').forEach(b => b.classList.toggle('active', b.dataset.be === be));
}

async function loadConvs() {
  const res = await fetch(`${API}/conversations`);
  const conversations = await res.json();
  convList.innerHTML = conversations.map(c => `
    <div class="conv-item ${c.id === convId ? 'active' : ''}">
      <div class="info" onclick="loadConv('${c.id}')">
        <div class="title">${esc(c.title || c.id)}<span class="badge ${c.backend}">${c.backend}</span></div>
        <span class="time">${c.message_count} 条 · ${new Date(c.updated_at).toLocaleString('zh-CN')}</span>
      </div>
      <button class="del-btn" onclick="event.stopPropagation(); deleteConv('${c.id}')" title="删除">&times;</button>
    </div>
  `).join('');
}

async function deleteConv(id) {
  if (!confirm('确定删除这个对话？')) return;
  await fetch(`${API}/conversations/${id}`, { method: 'DELETE' });
  if (convId === id) newChat();
  loadConvs();
}

async function loadConv(id) {
  convId = id;
  const res = await fetch(`${API}/conversations/${id}?limit=50`);
  const data = await res.json();
  chatEl.innerHTML = '';
  if (data.messages) data.messages.forEach(m => addMsg(m.role, m.content, m.tool_calls));
  chatTitle.textContent = data.title || id;
  // 切换到该对话所属的后端
  currentBackend = data.backend || 'claude';
  backendConvIds[currentBackend] = id;
  setBackend(currentBackend);
  info.textContent = `${currentBackend} · 对话 ${id}`;
  loadConvs();
}

function newChat() {
  convId = null;
  chatEl.innerHTML = '<div class="welcome">开始一个新的对话</div>';
  chatTitle.textContent = '小助手';
  setBackend('claude');
  input.focus();
}

function renderToolCalls(tcs) {
  if (!tcs || !tcs.length) return '';
  let h = '<div style="margin-bottom:8px">';
  tcs.forEach(tc => {
    const name = tc.name || '(unknown)';
    const inp = typeof tc.input === 'object' ? JSON.stringify(tc.input, null, 2) : (tc.input || '');
    const result = tc.result || '';
    h += `<div class="tool-call">
      <div class="tool-call-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.arrow').classList.toggle('open')">
        <span class="icon">🔧</span>
        <span class="name">${esc(name)}</span>
        <span class="arrow">▶</span>
      </div>
      <div class="tool-call-body">${esc(inp)}</div>
      ${result ? `<div class="tool-call-body tool-call-result">${esc(typeof result === 'string' ? result.slice(0,1000) : JSON.stringify(result).slice(0,1000))}</div>` : ''}
    </div>`;
  });
  return h + '</div>';
}

function addMsg(role, text, toolCalls) {
  const welcome = chatEl.querySelector('.welcome');
  if (welcome) welcome.remove();
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = renderToolCalls(toolCalls) + md(text);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function md(s) {
  return esc(s)
    .replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => `<pre><code>${c}</code></pre>`)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

let pendingReset = false;

function resetSession() {
  if (!convId) return;
  pendingReset = true;
  addMsg('assistant', '🔄 会话已重置，下一次对话将开启新的 CLI 上下文');
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMsg('user', text);
  input.value = ''; input.style.height = 'auto';
  sendBtn.disabled = true;
  const reset = pendingReset;
  pendingReset = false;

  // 创建空的 assistant 消息 div，后续流式填充
  const welcome = chatEl.querySelector('.welcome');
  if (welcome) welcome.remove();
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg assistant';
  msgDiv.innerHTML = '<span class="streaming-cursor"></span>';
  chatEl.appendChild(msgDiv);
  chatEl.scrollTop = chatEl.scrollHeight;

  let fullText = '';
  let toolCalls = [];  // {name, input, result}

  function renderAssistant() {
    let html = '';
    for (const tc of toolCalls) {
      const name = esc(tc.name || '(unknown)');
      const inp = typeof tc.input === 'object' ? JSON.stringify(tc.input, null, 2) : (tc.input || '');
      html += `<div class="tool-call">
        <div class="tool-call-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.arrow').classList.toggle('open')">
          <span class="icon">🔧</span>
          <span class="name">${name}</span>
          <span class="arrow">▶</span>
        </div>
        <div class="tool-call-body">${esc(inp)}</div>
        ${tc.result ? `<div class="tool-call-body tool-call-result">${esc(tc.result.slice(0,1000))}</div>` : ''}
      </div>`;
    }
    return html + md(fullText);
  }

  try {
    const res = await fetch(`${API}/chat`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, conversation_id: convId, backend: currentBackend, reset_session: reset, stream: true }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // 按行解析 SSE 事件
      const lines = buffer.split('\n');
      buffer = lines.pop(); // 保留未完成的行

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') continue;

        try {
          const ev = JSON.parse(data);
          if (ev.event === 'text') {
            fullText += ev.text;
            msgDiv.innerHTML = renderAssistant() + '<span class="streaming-cursor"></span>';
            chatEl.scrollTop = chatEl.scrollHeight;
          } else if (ev.event === 'tool_call') {
            toolCalls.push({ name: ev.name || '', input: ev.input || {}, result: '' });
            msgDiv.innerHTML = renderAssistant() + '<span class="streaming-cursor"></span>';
            chatEl.scrollTop = chatEl.scrollHeight;
          } else if (ev.event === 'tool_result') {
            if (toolCalls.length > 0) {
              toolCalls[toolCalls.length - 1].result = (ev.content || '').slice(0, 1000);
            }
            msgDiv.innerHTML = renderAssistant() + '<span class="streaming-cursor"></span>';
            chatEl.scrollTop = chatEl.scrollHeight;
          } else if (ev.event === 'session') {
            // session_id 由后端自动保存
          } else if (ev.event === 'error') {
            fullText += '\n\n❌ ' + (ev.text || '未知错误');
            msgDiv.innerHTML = renderAssistant();
          } else if (ev.event === 'result') {
            if (ev.text && ev.text !== fullText) {
              fullText = ev.text;
            }
            msgDiv.innerHTML = renderAssistant();
            convId = ev.session_id || convId;
          }
        } catch (e) { /* 跳过无法解析的行 */ }
      }
    }

    // 最终渲染（去掉 streaming-cursor）
    msgDiv.innerHTML = renderAssistant();
    // 保存该后端的 conversation id
    if (convId) backendConvIds[currentBackend] = convId;
    info.textContent = `${currentBackend} · 对话 ${convId}`;
    loadConvs();
  } catch (e) {
    msgDiv.innerHTML = md(`[错误] ${e.message}`);
  } finally {
    typing.classList.remove('active');
    sendBtn.disabled = false;
    input.focus();
  }
}

loadConvs();
input.focus();
</script>
</body>
</html>
